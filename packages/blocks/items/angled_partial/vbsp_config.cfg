"Conditions"
	{
	"Condition"
		{
		"instance" "<ITEM_BEE2_BLOCK_ANGLED_PARTIAL>"

		"Result"
			{
			"ReadSurfType"
				{
				"Pos1" "-48 -48 0"
				"Pos2" "48 48 0"
				"resultVar" "$color"
				}
			}

		"Switch"
			{
			"test" "instance"
			"<ITEM_BEE2_BLOCK_ANGLED_PARTIAL:btn_weighted>"
				{
				"SetInstVar" "$template BEE2_ANGLED_PARTIAL_128_32_32"
				}
			"<ITEM_BEE2_BLOCK_ANGLED_PARTIAL:btn_cube>"
				{
				"SetInstVar" "$template BEE2_ANGLED_PARTIAL_128_64_64"
				}
			"<ITEM_BEE2_BLOCK_ANGLED_PARTIAL:btn_sphere>"
				{
				"SetInstVar" "$template BEE2_ANGLED_PARTIAL_128_96_96"
				}
			}

		"Condition"
			{
			"instvar" "$start_enabled 1"
			"Result"
				{
				"TemplateBrush"
					{
					"ID"          "$template"
					"colorVar"    "$color"
					"invertVar"   "$start_reversed"

					"bindOverlay" "0 0 0"
					}
				}
			"Else"
				{
				"TemplateBrush"
					{
					"ID"        "$template"
					"colorVar"  "$color"
					"invertVar" "$start_reversed"
					}
				}
			}
		"Result"
			{
			"Changeinstance" ""
			}
		}
	}
